services:
  nats:
    image: nats:2.11-alpine
    command: ["-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  openclaw-gateway:
    depends_on:
      - nats
    volumes:
      - ./extensions/lucy/node_modules:/app/extensions/lucy/node_modules

  openclaw-cli:
    depends_on:
      - nats
    volumes:
      - ./extensions/lucy/node_modules:/app/extensions/lucy/node_modules
